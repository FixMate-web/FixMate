# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: fixmate-api
    runtime: node
    plan: free
    branch: deploy/atlas-vercel-render
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_SESSION_TTL_DAYS
        value: "7"
